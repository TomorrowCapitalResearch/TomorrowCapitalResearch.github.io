<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tomorrow Capital Research</title>
  <meta name="description" content="Tomorrow Capital Research is a quantitative research and trading firm building adaptive, systematic trading strategies.">
  <link rel="icon" type="image/png" href="assets/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400&display=swap">

  <style>
  :root{
    --tm-white:#FFFFFF;
    --tm-deep:#0E3275;
    --tm-navy:#0A1D45;
    --tm-slate:#4A5878;
    --tm-mist:#DCE3EE;
    --tm-sans:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --tm-serif:"Source Serif 4", "Iowan Old Style", Georgia, serif;
    --tm-max:1200px;
    --tm-pad:24px;
    --tm-header-h:72px;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--tm-sans);
    color:var(--tm-navy);
    background:var(--tm-white);
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* Reserve the header's height so the page doesn't jump when it's injected. */
  #site-header{min-height:var(--tm-header-h)}

  /* ===== Hero ===== */
  .hero{
    position:relative;
    height:clamp(480px, 78svh, 880px);
    overflow:hidden;
    isolation:isolate;
    /* White at the top so it runs straight out of the header, deepening into navy. */
    background:linear-gradient(180deg,
      #FFFFFF 0%,
      #FFFFFF 8%,
      #E6ECF5 24%,
      #A7B8D6 42%,
      #4A659C 60%,
      #0E3275 78%,
      #0A1D45 100%);
  }

  .hero__backdrop{position:absolute;inset:0;z-index:-1}

  .hero__field,
  .hero__video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }
  .hero__field{opacity:0;transition:opacity 1.8s ease}
  .hero__field.is-ready{opacity:1}
  .hero__video{object-fit:cover}

  /* Keeps the headline legible over whatever video you drop in later. */
  .hero__scrim{
    position:absolute;
    inset:auto 0 0 0;
    height:55%;
    background:linear-gradient(0deg, rgba(10,29,69,.55), rgba(10,29,69,0));
    pointer-events:none;
  }

  .hero__inner{
    max-width:var(--tm-max);
    height:100%;
    margin:0 auto;
    padding:0 var(--tm-pad) clamp(40px, 8vh, 96px);
    display:flex;
    align-items:flex-end;
  }

  .hero__title{
    margin:0;
    max-width:6.2em;
    font-family:var(--tm-serif);
    font-weight:300;
    font-size:clamp(3rem, 8.2vw, 7.5rem);
    line-height:.98;
    letter-spacing:-.025em;
    color:var(--tm-white);
  }

  /* ===== Statement under the hero ===== */
  .intro{
    padding:clamp(72px, 11vw, 144px) 0 clamp(88px, 12vw, 160px);
  }
  .intro__inner{max-width:var(--tm-max);margin:0 auto;padding:0 var(--tm-pad)}

  .intro__statement{
    margin:0;
    max-width:25em;
    font-family:var(--tm-serif);
    font-weight:400;
    font-size:clamp(1.375rem, 2.3vw, 2rem);
    line-height:1.4;
    letter-spacing:-.005em;
    color:var(--tm-navy);
  }

  .intro__links{
    margin:40px 0 0;
    display:flex;
    flex-wrap:wrap;
    gap:12px 32px;
  }
  .intro__links a{
    font-size:16px;
    font-weight:500;
    color:var(--tm-deep);
    text-decoration:underline;
    text-decoration-thickness:1px;
    text-underline-offset:6px;
    text-decoration-color:rgba(14,50,117,.35);
  }
  .intro__links a:hover{text-decoration-color:currentColor}
  .intro__links a:focus-visible{
    outline:2px solid var(--tm-deep);
    outline-offset:4px;
    border-radius:2px;
  }

  @media (max-width:560px){
    :root{--tm-pad:20px}
    .hero{height:clamp(440px, 72svh, 640px)}
  }

  @media (prefers-reduced-motion:reduce){
    .hero__field{transition:none}
  }
  </style>

  <script>
  /* Loads a shared fragment (header/footer) from the site's /shared folder into a placeholder. */
  function absolutizeAttr(node, attr, base){
    var val = node.getAttribute(attr);
    if (!val || /^(https?:)?\/\//i.test(val) || val.startsWith('data:') || val.startsWith('mailto:') || val.startsWith('#')) return;
    try { node.setAttribute(attr, new URL(val, base).href); } catch(e){}
  }

  function runScript(s){
    return new Promise(function(resolve){
      var el = document.createElement('script');
      if (s.src){
        el.src = s.src;
        el.onload = el.onerror = function(){ resolve(); };
        document.body.appendChild(el);
      } else {
        el.textContent = s.textContent;
        if (s.type) el.type = s.type;
        document.body.appendChild(el);
        resolve();
      }
    });
  }

  async function injectFragment(hostSelector, url, baseHref){
    var host = document.querySelector(hostSelector);
    if (!host) return false;
    try {
      var res = await fetch(url, { cache:'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status + ' for ' + url);
      var doc = new DOMParser().parseFromString(await res.text(), 'text/html');

      var base = baseHref || new URL(url, location.href).href;
      doc.querySelectorAll('a[href], link[href], img[src], script[src]').forEach(function(el){
        if (el.hasAttribute('href')) absolutizeAttr(el, 'href', base);
        if (el.hasAttribute('src'))  absolutizeAttr(el, 'src', base);
      });

      doc.querySelectorAll('link[rel="stylesheet"], link[rel="preconnect"]').forEach(function(link){
        var exists = document.head.querySelector('link[href="' + link.getAttribute('href') + '"]');
        if (!exists) document.head.appendChild(link.cloneNode(true));
      });
      doc.querySelectorAll('style').forEach(function(style){
        document.head.appendChild(style.cloneNode(true));
      });

      var content = doc.body.cloneNode(true);
      content.querySelectorAll('script, link, style').forEach(function(n){ n.remove(); });
      host.replaceChildren.apply(host, Array.from(content.childNodes));

      for (var s of doc.querySelectorAll('script')) await runScript(s);
      return true;
    } catch(e){
      console.error('inject failed:', e);
      return false;
    }
  }
  </script>
</head>

<body>

  <!-- HEADER SLOT -->
  <div id="site-header"></div>
  <script>
    injectFragment('#site-header',
      'https://tomorrowcapitalresearch.github.io/shared/header.html',
      'https://tomorrowcapitalresearch.github.io/shared/');
  </script>
  <!-- /HEADER SLOT -->

  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero__backdrop" aria-hidden="true">
        <canvas class="hero__field"></canvas>

        <!--
          Using your own video instead of the dot field:
          1. Put the files in /assets (e.g. hero.webm and hero.mp4, plus a still frame as hero-poster.jpg).
          2. Uncomment the <video> below. The dot field switches itself off when a video is present.

        <video class="hero__video" autoplay muted loop playsinline preload="metadata" poster="assets/hero-poster.jpg">
          <source src="assets/hero.webm" type="video/webm">
          <source src="assets/hero.mp4" type="video/mp4">
        </video>
        -->

        <div class="hero__scrim"></div>
      </div>

      <div class="hero__inner">
        <h1 id="hero-title" class="hero__title">For a better tomorrow.</h1>
      </div>
    </section>

    <section class="intro" aria-label="About Tomorrow Capital Research">
      <div class="intro__inner">
        <p class="intro__statement">
          Tomorrow Capital Research is a quantitative research and trading firm. We build adaptive,
          systematic trading strategies from physics-inspired models of market structure, across
          digital assets and other markets.
        </p>
        <p class="intro__links">
          <a href="research.html">Read our research</a>
          <a href="contact.html">Get in touch</a>
        </p>
      </div>
    </section>
  </main>

  <!-- FOOTER SLOT -->
  <div id="site-footer"></div>
  <script>
    injectFragment('#site-footer',
      'https://tomorrowcapitalresearch.github.io/shared/footer.html',
      'https://tomorrowcapitalresearch.github.io/shared/');
  </script>
  <!-- /FOOTER SLOT -->

  <script>
  /* Hero dot field: a lattice of dots that fades in from the white top, gently drawn
     toward a slowly drifting well, with a faint travelling wave across it. */
  (function(){
    var hero = document.querySelector('.hero');
    if (!hero) return;
    var canvas = hero.querySelector('.hero__field');
    var video  = hero.querySelector('.hero__video');
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');

    if (video){
      if (canvas) canvas.remove();
      if (reduce.matches){ video.removeAttribute('autoplay'); video.pause(); }
      return;
    }
    if (!canvas || !canvas.getContext) return;

    var ctx = canvas.getContext('2d');
    var W = 0, H = 0, blue = [], white = [];
    var raf = 0, onScreen = true, t0 = performance.now();

    function smooth(a, b, x){ var k = Math.min(1, Math.max(0, (x - a) / (b - a))); return k * k * (3 - 2 * k); }

    function build(){
      W = hero.clientWidth; H = hero.clientHeight;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      var s = W < 640 ? 22 : 28;
      var cols = Math.ceil(W / s) + 1, rows = Math.ceil(H / s) + 1;
      var ox = (W - (cols - 1) * s) / 2;
      blue = []; white = [];

      for (var r = 0; r < rows; r++){
        var y = r * s + s / 2, t = y / H;
        for (var c = 0; c < cols; c++){
          var x = ox + c * s;
          if (t < 0.48){
            // Faint deep-blue dots emerging out of the white.
            var a = 0.13 * Math.sin(Math.PI * smooth(0.12, 0.48, t));
            if (a > 0.004) blue.push({ x:x, y:y, a:a, r:1.1 + t });
          } else {
            // Light dots on the deep blue, stronger toward the bottom.
            white.push({ x:x, y:y, a:0.05 + 0.24 * smooth(0.48, 1, t), r:1.2 + 0.9 * t });
          }
        }
      }
    }

    function drawSet(set, time, wx, wy, inv, glow){
      for (var i = 0; i < set.length; i++){
        var d = set[i];
        var dx = wx - d.x, dy = wy - d.y;
        var g = Math.exp(-(dx * dx + dy * dy) * inv);
        var wave = Math.sin(d.x * 0.010 + d.y * 0.006 - time * 0.7);
        var x = d.x + dx * 0.2 * g;
        var y = d.y + dy * 0.2 * g + wave * 2.2;
        var a = d.a * (0.8 + 0.2 * wave) + g * glow;
        if (a <= 0.003) continue;
        ctx.globalAlpha = a > 1 ? 1 : a;
        ctx.beginPath();
        ctx.arc(x, y, d.r + g * 1.1, 0, 6.2832);
        ctx.fill();
      }
    }

    function frame(now){
      var time = (now - t0) / 1000 + 12;
      var wx = W * (0.64 + 0.17 * Math.sin(time * 0.05));
      var wy = H * (0.66 + 0.10 * Math.sin(time * 0.08 + 1.2));
      var sigma = Math.max(110, Math.min(W, H) * 0.26);
      var inv = 1 / (2 * sigma * sigma);

      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#0E3275'; drawSet(blue,  time, wx, wy, inv, 0.10);
      ctx.fillStyle = '#E4ECFA'; drawSet(white, time, wx, wy, inv, 0.38);
      ctx.globalAlpha = 1;
    }

    function loop(now){
      frame(now);
      raf = requestAnimationFrame(loop);
    }
    function start(){
      if (raf || reduce.matches || !onScreen || document.hidden) return;
      raf = requestAnimationFrame(loop);
    }
    function stop(){ cancelAnimationFrame(raf); raf = 0; }

    build();
    frame(performance.now());
    canvas.classList.add('is-ready');
    start();

    new ResizeObserver(function(){ build(); frame(performance.now()); }).observe(hero);
    new IntersectionObserver(function(e){ onScreen = e[0].isIntersecting; onScreen ? start() : stop(); }).observe(hero);
    document.addEventListener('visibilitychange', function(){ document.hidden ? stop() : start(); });
    reduce.addEventListener && reduce.addEventListener('change', function(){ reduce.matches ? stop() : start(); });
  })();
  </script>
</body>
</html>
